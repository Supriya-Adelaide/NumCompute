[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute_stream"
version = "2.2.0"
description = "Streaming, decision-tree-based learning framework built on NumPy"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "jupyter", "nbformat"]

[tool.setuptools]
packages = ["numcompute_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
